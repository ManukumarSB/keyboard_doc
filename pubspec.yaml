name: keyboard_dock
description: Keeps a footer docked above the soft keyboard and the home indicator. Zero dependencies, just MediaQuery.
version: 0.1.0
homepage: https://github.com/ManukumarSB/keyboard_doc
repository: https://github.com/ManukumarSB/keyboard_doc
issue_tracker: https://github.com/ManukumarSB/keyboard_doc/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - keyboard
  - widget
  - layout
  - ui

screenshots:
  - description: Footer above the home indicator with the keyboard closed.
    path: doc/keyboard_closed.png
  - description: Same footer riding on top of the keyboard.
    path: doc/keyboard_open.png
  - description: A toolbar that only shows while typing.
    path: doc/toolbar.png
